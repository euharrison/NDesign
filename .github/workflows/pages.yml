name: Deploy games to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'linerider-html5/**'
      - 'bloquinhos-html5/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  # Lets you publish without waiting for a push, from the Actions tab.
  workflow_dispatch:

# Least privilege: read the code, mint an OIDC token, publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # planck requires Node >= 24.
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            linerider-html5/package-lock.json
            bloquinhos-html5/package-lock.json

      # `npm run build` type-checks first, so a broken build never ships.
      - name: Build Line Rider
        working-directory: linerider-html5
        run: |
          npm ci
          npm test
          npm run build

      - name: Build Bloquinhos
        working-directory: bloquinhos-html5
        run: |
          npm ci
          npm test
          npm run build

      # The landing page owns the root; each game sits in its own directory.
      # Both bundles use `base: './'`, so they run from any depth.
      - name: Assemble the site
        run: |
          mkdir -p _site/linerider _site/bloquinhos
          cp site/index.html _site/index.html
          cp -r linerider-html5/dist/. _site/linerider/
          cp -r bloquinhos-html5/dist/. _site/bloquinhos/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
